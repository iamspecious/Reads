# TEMPORARY, read-only: compares what the thread walk finds with every post
# on the account's own feed that belongs to this thread. Writes nothing.
name: Diagnose missing posts
on:
  push:
    branches: [claude/reads-microblog-jekyll-vuocqj]
    paths: [.github/workflows/diag-embeds.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import import_bluesky as imp
          did = imp.resolve_did("booksbyspec.bsky.social")
          root = f"at://{did}/app.bsky.feed.post/3mzxieaiuys2i"
          walked = {p["uri"] for p in imp.walk_thread(root, did)}
          feed, cursor, pages = [], None, 0
          while pages < 30:
              params = {"actor": did, "filter": "posts_with_replies", "limit": 100}
              if cursor: params["cursor"] = cursor
              d = imp.xrpc("app.bsky.feed.getAuthorFeed", **params)
              pages += 1
              for item in d.get("feed", []):
                  if item.get("reason"): continue
                  feed.append(item["post"])
              cursor = d.get("cursor")
              if not cursor or (feed and feed[-1]["record"]["createdAt"] < "2026-11-10"): break
          in_thread = [p for p in feed if p["uri"] == root or (p["record"].get("reply") or {}).get("root", {}).get("uri") == root]
          print("walk found:", len(walked), "| feed posts in this thread:", len(in_thread), "| feed pages:", pages)
          other_roots = {}
          for p in feed:
              r = (p["record"].get("reply") or {}).get("root", {}).get("uri")
              if p["record"]["createdAt"] >= "2026-11-10" and r != root and p["uri"] != root:
                  other_roots.setdefault(r or "TOP-LEVEL", []).append(p)
          print("\nIN THREAD BUT MISSED BY WALK:")
          for p in sorted(in_thread, key=lambda p: p["record"]["createdAt"]):
              if p["uri"] not in walked:
                  par = p["record"]["reply"]["parent"]["uri"]
                  print(" ", p["record"]["createdAt"][:16], p["uri"].rsplit("/",1)[-1], "| parent by me:", par.startswith(f"at://{did}/"), "|", p["record"]["text"][:60].replace("\n"," "))
          print("\nMY POSTS SINCE 10 NOV OUTSIDE THIS THREAD (by root):")
          for r, ps in other_roots.items():
              print(" root:", r, "| count:", len(ps))
              for p in sorted(ps, key=lambda p: p["record"]["createdAt"])[:12]:
                  print("    ", p["record"]["createdAt"][:16], p["uri"].rsplit("/",1)[-1], "|", p["record"]["text"][:60].replace("\n"," "))
          PY
