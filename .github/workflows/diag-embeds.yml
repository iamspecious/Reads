# TEMPORARY: read-only check of which Klipy address serves the MP4 version
# of a GIF. Downloads nothing into the repo. Will be deleted.
name: Diagnose Klipy MP4
on:
  push:
    branches: [claude/reads-microblog-jekyll-vuocqj]
    paths: [.github/workflows/diag-embeds.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try candidate addresses
        run: |
          base="https://static.klipy.com/ii/d7aec6f6f171607374b2065c836f92f4/a6/c2"
          for u in \
            "$base/laPXiRSR.gif" \
            "$base/FjzfBwfIEW4RIK.mp4" \
            "$base/laPXiRSR.mp4" \
            "$base/FjzfBwfIEW4RIK.webm" \
            "$base/mAnM00eb4k8vJC3Ku6wm.webm" \
            "https://static.klipy.com/ii/d7aec6f6f171607374b2065c836f92f4/FjzfBwfIEW4RIK.mp4" ; do
            curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download} bytes  $u\n" "$u" || echo "fail $u"
          done
