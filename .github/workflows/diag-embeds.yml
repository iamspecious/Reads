# TEMPORARY: read-only check of how Bluesky stores the attachments in the
# A Court of Silver Flames thread. Prints each post's embed type. Writes
# nothing. Lives only on a working branch and will be deleted.
name: Diagnose Bluesky embeds
on:
  push:
    branches: [claude/reads-microblog-jekyll-vuocqj]
    paths: [.github/workflows/diag-embeds.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print embed types
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import import_bluesky as imp
          did = imp.resolve_did("booksbyspec.bsky.social")
          posts = imp.walk_thread(f"at://{did}/app.bsky.feed.post/3mzxieaiuys2i", did)
          for p in posts:
              rk = p["uri"].rsplit("/", 1)[-1]
              view = p.get("embed") or {}
              rec = p["record"].get("embed") or {}
              text = p["record"].get("text", "")[:40].replace("\n", " ")
              if view or rec:
                  print("=====", rk, "|", text)
                  print("VIEW:", json.dumps(view)[:1200])
                  print("RECORD:", json.dumps(rec)[:800])
          print("posts:", len(posts))
          PY
