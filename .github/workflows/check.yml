# check.yml — runs the tests on every push and pull request,
# including every post made from the /new page.
#
# Two kinds of test:
#  - tests/test_import_bluesky.py checks the importer against a fake
#    Bluesky, so our own rules (only self-replies, "fetch again", skipping
#    re-imports, chapter spotting) are tested without touching the network.
#  - tests/test_content.py checks every log and entry file in the repo, so a
#    broken or mistyped post shows up as a red X here instead of quietly
#    going missing from the site.
# GitHub Pages builds the site itself, so this file doesn't build it.

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
