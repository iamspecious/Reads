{% comment %}
  footer.html — the bottom of every page.
  Kept to the name and two links. No slogans: any words on this site
  should be Spec's own, so the footer doesn't add any.
{% endcomment %}
<footer class="site-footer">
  <div class="wrap footer-row">
    <span>{{ site.title }}</span>
    <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a> · <a href="https://bsky.app/profile/{{ site.bluesky }}" rel="me noopener">Bluesky</a></span>
  </div>
</footer>
